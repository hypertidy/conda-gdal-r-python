name: base
channels:
  - conda-forge
  - nodefaults
dependencies:
  # because humans need to do things
  - nano
  - git
  - wget
  # Python and R and spatial
  - python>=3.12
  - r-base>=4.5
  - gdal
  - geos
  - proj
  # R geo
  - r-terra
  - r-sf
  - r-gdalraster
  # R all for vapour which installs from source (for now, yes against advice but motivating to get r-vapour out there)
  - r-glue
  - r-lifecycle
  - r-vctrs
  - r-stringr
  - r-stringi
  - r-jsonlite
  - r-nanoarrow
  - r-wk
  - r-cpp11
  # GDAL modular packaging — libgdal-core is pulled in automatically;
  # add plugins explicitly for the drivers you need
  - libgdal-arrow-parquet   # vector.arrow + vector.parquet drivers
  - libgdal-netcdf          # raster.netcdf driver
  - libgdal-hdf5
  # R bridge
  - r-reticulate
  # Python geo
  - rasterio
  - pyogrio
  - fiona
  - geopandas ## needed to test pyogrio
